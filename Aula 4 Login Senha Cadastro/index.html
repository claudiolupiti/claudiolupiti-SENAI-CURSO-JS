<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>LOGIN</title>

    <body>
        <h1>Formulário Login - Senha</h1>

        <form onsubmit="return validarLogin()">

            <label for="senha">Senha: </label><br><br>

        </form>
        <script src="script.js"></script>
    </body>
</html>
